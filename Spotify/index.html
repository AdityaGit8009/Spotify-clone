<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111715">
  <title>Spotify clone · Music library</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <script defer src="catalog.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#releases"><span class="brand-mark" aria-hidden="true">A.</span>Spotify clone</a>
    <span class="topbar-label">Music library</span>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <nav aria-label="Your library">
        <h2>Your library</h2>
        <a href="#releases">Local releases</a>
        <a href="#discover-song">Discover picks</a>
        <a href="#indias-best-song">India’s best</a>
        <a href="#popular-song">Popular music</a>
      </nav>
      <p class="credit">Made by <strong>Aditya Pratap Vishwakarma</strong> with #teamDigiCoders</p>
    </aside>
    <main id="library">
      <section id="releases" class="release-section" aria-labelledby="local-title">
        <h1 id="local-title">Local releases</h1>
        <div class="release-grid" id="release-list"></div>
      </section>
      <section class="shelf" aria-labelledby="discover-title">
        <h2 id="discover-title">Discover picks for you</h2>
        <div class="cardwrapper" id="discover-song"></div>
      </section>
      <section class="shelf" aria-labelledby="india-title">
        <h2 id="india-title">India’s best</h2>
        <div class="cardwrapper" id="indias-best-song"></div>
      </section>
      <section class="shelf" aria-labelledby="popular-title">
        <h2 id="popular-title">Popular music</h2>
        <div class="cardwrapper" id="popular-song"></div>
      </section>
    </main>
  </div>
  <footer class="audio-player" aria-label="Music player">
    <audio id="audio" controls preload="metadata"></audio>
  </footer>
</body>
</html>
